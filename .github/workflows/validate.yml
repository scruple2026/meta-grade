name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test battle API
        run: node scripts/test-battle-api.js

      - name: Validate data strictly
        run: node scripts/validate-data.js --strict-warnings

      - name: Check core JavaScript syntax
        run: |
          node --check api/battle.js
          node --check assets/app.js
          node --check data/core.js
          node --check data/characters.js
          node --check scripts/validate-data.js
          node --check scripts/create-character.js
          node --check scripts/create-work.js
          node --check scripts/apply-character-proposal.js
          node --check scripts/sync-reference.js
          node --check scripts/check-links.js
          node --check scripts/check-source-content.js
          node --check scripts/test-battle-api.js
          node --check scripts/hash-battle-access-code.js

      - name: Check data script syntax
        run: find data/works data/characters -type f -name '*.js' -exec node --check {} +
